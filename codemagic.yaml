workflows:
  android-apk-workflow:
    name: بناء تطبيق نور العترة (Android APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: ١. الإعداد وبناء واجهة نور العترة
        script: |
          #!/usr/bin/env bash
          set -e
          echo "" | base64 --decode > /tmp/noor_bundle.tar.gz
          tar -xzf /tmp/noor_bundle.tar.gz
          npm install --legacy-peer-deps
          npm run build
      - name: ٢. تهيئة بيئة أندرويد وتثبيت الأيقونة الخضراء والأذان والإشعارات
        script: |
          #!/usr/bin/env bash
          set -e
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 --no-save --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          mkdir -p android/app/src/main/res/raw
          curl -L -s --fail "https://archive.org/download/ShiaAzan/ShiaAzan.mp3" -o android/app/src/main/res/raw/shia_azan.mp3 || curl -L -s "https://www.islamcan.com/audio/adhan/azan1.mp3" -o android/app/src/main/res/raw/shia_azan.mp3 || true
          node setup-android.cjs
      - name: ٣. تجميع وبناء ملف APK النهائي
        script: |
          #!/usr/bin/env bash
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
