workflows:
  android-apk-workflow:
    name: بناء تطبيق نور العترة (Android APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: ١. الإعداد وبناء واجهة نور العترة
        script: |
          #!/usr/bin/env bash
          set -e
          echo "" | base64 --decode > /tmp/noor_bundle.tar.gz
          tar -xzf /tmp/noor_bundle.tar.gz
          npm install --legacy-peer-deps
          npm run build
      - name: ٢. تهيئة بيئة أندرويد وتثبيت الأيقونة الخضراء والأذان والإشعارات
        script: |
          #!/usr/bin/env bash
          set -e
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 --no-save --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          mkdir -p android/app/src/main/res/raw
          curl -L -s --fail "https://archive.org/download/ShiaAzan/ShiaAzan.mp3" -o android/app/src/main/res/raw/shia_azan.mp3 || curl -L -s "https://www.islamcan.com/audio/adhan/azan1.mp3" -o android/app/src/main/res/raw/shia_azan.mp3 || true
          node -e '
            const fs = require("fs");
            const path = require("path");

            // 1. Update AndroidManifest.xml with notification & exact alarm permissions + app label
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
                "<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />",
                "<uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />",
                "<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />",
                "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
                "<uses-permission android:name=\"android.permission.VIBRATE\" />"
              ];
              for (const p of perms) {
                const nameMatch = p.match(/android:name="([^"]+)"/)[1];
                if (!xml.includes(nameMatch)) {
                  xml = xml.replace("<application", p + "\n    <application");
                }
              }
              fs.writeFileSync(manifestPath, xml, "utf8");
            }

            // 2. Ensure strings.xml has Arabic app_name "نور العترة"
            const stringsPath = "android/app/src/main/res/values/strings.xml";
            if (fs.existsSync(stringsPath)) {
              let s = fs.readFileSync(stringsPath, "utf8");
              s = s.replace(/<string name="app_name">.*?<\/string>/, "<string name=\"app_name\">نور العترة</string>");
              s = s.replace(/<string name="title_activity_main">.*?<\/string>/, "<string name=\"title_activity_main\">نور العترة</string>");
              fs.writeFileSync(stringsPath, s, "utf8");
            }

            // 3. Create clean status-bar notification icon (ic_stat_noor.xml) WITHOUT any exclamation mark (!)
            const drawableDir = "android/app/src/main/res/drawable";
            fs.mkdirSync(drawableDir, { recursive: true });
            const statIconXml = `<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="24dp"
    android:height="24dp"
    android:viewportWidth="24"
    android:viewportHeight="24">
    <path
        android:fillColor="#FFFFFF"
        android:pathData="M12,3C8.5,6 6.5,8.5 6.5,11.5L17.5,11.5C17.5,8.5 15.5,6 12,3ZM5,13L19,13L19,15L5,15L5,13ZM7,16.5L17,16.5L17,20L7,20L7,16.5Z"/>
</vector>`;
            fs.writeFileSync(path.join(drawableDir, "ic_stat_noor.xml"), statIconXml, "utf8");

            // 4. Configure Green Launcher Icon Background & Golden Mosque Dome Foreground
            const valuesDir = "android/app/src/main/res/values";
            fs.mkdirSync(valuesDir, { recursive: true });
            fs.writeFileSync(
              path.join(valuesDir, "ic_launcher_background.xml"),
              `<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#082818</color></resources>`,
              "utf8"
            );

            const fgXml = `<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#082818"
        android:pathData="M0,0h108v108h-108z"/>
    <path
        android:fillColor="#D4AF37"
        android:pathData="M54,24 C43,34 37,43 37,53 L71,53 C71,43 65,34 54,24 Z"/>
    <path
        android:fillColor="#F6E27A"
        android:pathData="M33,56 L75,56 L75,60 L33,60 Z"/>
    <path
        android:fillColor="#D4AF37"
        android:pathData="M38,64 L70,64 L70,78 L38,78 Z"/>
</vector>`;
            fs.writeFileSync(path.join(drawableDir, "ic_launcher_foreground.xml"), fgXml, "utf8");
            const v24Dir = "android/app/src/main/res/drawable-v24";
            if (fs.existsSync(v24Dir)) {
              fs.writeFileSync(path.join(v24Dir, "ic_launcher_foreground.xml"), fgXml, "utf8");
            }
          '
      - name: ٣. تجميع وبناء ملف APK النهائي
        script: |
          #!/usr/bin/env bash
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
