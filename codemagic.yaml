workflows:
  android-apk-workflow:
    name: بناء تطبيق نور العترة (Android APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: ١. تجهيز ملفات الإعداد وبناء واجهة نور العترة
        script: |
          cat << 'EOF' > firebase-applet-config.json
          {
            "projectId": "lyrical-env-qvr20",
            "appId": "1:173197035020:web:ce1072b74a832ce248d029",
            "apiKey": "AIzaSyBzE1SzJnmjG8Ke04km5F-nyF8uLxv2OIk",
            "authDomain": "lyrical-env-qvr20.firebaseapp.com",
            "firestoreDatabaseId": "ai-studio-9e4f4c66-1ea5-4257-8db1-6264fdff46a5",
            "storageBucket": "lyrical-env-qvr20.firebasestorage.app",
            "messagingSenderId": "173197035020",
            "measurementId": "",
            "oAuthClientId": "173197035020-4ns6vj2lno0n050rsuba9pnsiks6ntbl.apps.googleusercontent.com",
            "recaptchaSiteKey": ""
          }
          EOF
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nooralitrah.app",
            "appName": "نور العترة",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          # إعادة بناء هيكل المجلدات تلقائياً إذا كانت الملفات مرفوعة بدون مجلدات
          mkdir -p src/components src/data src/utils
          if [ -f "main.tsx" ] && [ ! -f "src/main.tsx" ]; then
            mv main.tsx App.tsx firebase.ts index.css src/ 2>/dev/null || true
          fi
          for comp in ApkCloudGuideModal.tsx CalendarSection.tsx MafatihSection.tsx MartyrsSection.tsx PrayerTimesSection.tsx QuranSection.tsx SplashScreen.tsx TaqeebatSection.tsx; do
            if [ -f "$comp" ] && [ ! -f "src/components/$comp" ]; then
              mv "$comp" src/components/ 2>/dev/null || true
            fi
          done
          for dfile in ahlulbaytEvents.ts mafatihData.ts quranData.ts taqeebatData.ts; do
            if [ -f "$dfile" ] && [ ! -f "src/data/$dfile" ]; then
              mv "$dfile" src/data/ 2>/dev/null || true
            fi
          done
          if [ -f "prayerTimes.ts" ] && [ ! -f "src/utils/prayerTimes.ts" ]; then
            mv prayerTimes.ts src/utils/ 2>/dev/null || true
          fi
          if [ -d "components" ]; then cp -rn components/* src/components/ 2>/dev/null || true; fi
          if [ -d "data" ]; then cp -rn data/* src/data/ 2>/dev/null || true; fi
          if [ -d "utils" ]; then cp -rn utils/* src/utils/ 2>/dev/null || true; fi
          npm install --legacy-peer-deps
          npm run build
      - name: ٢. إعداد بيئة الأندرويد الهجينة (Capacitor Android)
        script: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-save --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: ٣. تجميع وبناء ملف APK النهائي
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
