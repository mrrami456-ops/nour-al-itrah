workflows:
  android-apk-workflow:
    name: بناء تطبيق نور العترة (Android APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: ١. الإعداد وبناء واجهة نور العترة
        script: |
          #!/usr/bin/env bash
          set -e
          echo "" | base64 --decode > /tmp/noor_bundle.tar.gz
          tar -xzf /tmp/noor_bundle.tar.gz
          npm install --legacy-peer-deps
          npm run build
      - name: ٢. تهيئة بيئة أندرويد الهجينة وتفعيل أذونات الإشعارات في النظام
        script: |
          #!/usr/bin/env bash
          set -e
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 --no-save --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
                "<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />",
                "<uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />",
                "<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />",
                "<uses-permission android:name=\"android.permission.WAKE_LOCK\" />",
                "<uses-permission android:name=\"android.permission.VIBRATE\" />"
              ];
              for (const p of perms) {
                const nameMatch = p.match(/android:name="([^"]+)"/)[1];
                if (!xml.includes(nameMatch)) {
                  xml = xml.replace("<application", p + "\n    <application");
                }
              }
              fs.writeFileSync(manifestPath, xml, "utf8");
            }
          '
      - name: ٣. تجميع وبناء ملف APK النهائي
        script: |
          #!/usr/bin/env bash
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
